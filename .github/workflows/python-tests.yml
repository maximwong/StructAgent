name: Python regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
      - name: Create pinned Windows Python environment
        run: |
          $demoPythonVersion = (Get-Content .python-version -Raw).Trim()
          uv python install $demoPythonVersion
          uv venv --seed --python $demoPythonVersion .venv-demo
          (Join-Path $PWD '.venv-demo/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-demo.lock
      - name: Verify pinned demo dependencies
        run: |
          python -m pip check
          python -m examples.environment_check
      - name: Run core, floor design and CAD contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Dummy Tool example
        run: python -m examples.dummy_tool
      - name: Run floor design example
        run: python -m examples.floor_design
      - name: Run tests without AutoCAD
        working-directory: legacy/rc_floor
        run: python -m unittest discover -s tests -p "test_*.py"
