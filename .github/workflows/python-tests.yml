name: Python regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r legacy/rc_floor/requirements.txt
      - name: Run tests without AutoCAD
        working-directory: legacy/rc_floor
        run: python -m unittest discover -s tests -p "test_*.py"
